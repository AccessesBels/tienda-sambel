<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamBel Access | Store Oficial</title>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #3b82f6; --text: #ffffff; --green: #25d366; --blue: #0088cc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { padding: 40px 20px; text-align: center; background: #000; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 32px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; }
        .logo span { color: var(--accent); }
        
        .category-title { grid-column: 1 / -1; text-align: left; margin: 40px 0 20px; padding-left: 15px; border-left: 4px solid var(--accent); font-size: 22px; text-transform: uppercase; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 20px; max-width: 1400px; margin: auto; }
        .card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #222; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 0 30px rgba(59,130,246,0.3); }
        
        .card img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 15px; border-radius: 12px; }
        .card h3 { margin: 0; font-size: 18px; text-align: center; }
        .price { font-size: 30px; font-weight: bold; color: var(--accent); margin: 15px 0; }
        
        .btn-group { display: flex; gap: 10px; width: 100%; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; color: white; transition: 0.2s; }
        .btn-ws { background: var(--green); }
        .btn-tg { background: var(--blue); }
        .btn:hover { filter: brightness(1.2); }
        
        footer { padding: 60px; opacity: 0.4; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

<header><div class="logo">SamBel <span>Access</span></div></header>

<div class="container" id="catalogo"></div>

<footer>&copy; 2026 SAMBEL ACCESS | LA GUAIRA, VENEZUELA</footer>

<script>
const productos = [
    { cat: "🎮 GAMING & RECARGAS", items: [
        { n: "Minecraft Premium", p: "15 USD", img: "minecraft" },
        { n: "Free Fire (Diamantes)", p: "Desde 1 USD", img: "free-fire" },
        { n: "COD Mobile (CP)", p: "Desde 1 USD", img: "call-of-duty" },
        { n: "Blood Strike", p: "Desde 1 USD", img: "target" }
    ]},
    { cat: "🎬 SERIES Y PELÍCULAS", items: [
        { n: "Netflix Única", p: "6 USD", img: "netflix" }, { n: "Netflix Premium", p: "4 USD", img: "netflix" },
        { n: "Disney+ Premium", p: "3.5 USD", img: "disney" }, { n: "Disney+ Estándar", p: "2 USD", img: "disney" },
        { n: "MAX", p: "3 USD", img: "hbo" }, { n: "Prime Video", p: "3 USD", img: "amazon" },
        { n: "Crunchyroll", p: "2.5 USD", img: "crunchyroll" }, { n: "Paramount+", p: "3 USD", img: "paramount" }
    ]},
    { cat: "🎵 MÚSICA", items: [
        { n: "Spotify", p: "4 USD", img: "spotify" }, { n: "YouTube Premium", p: "4 USD", img: "youtube" },
        { n: "Apple Music", p: "3 USD", img: "apple" }
    ]},
    { cat: "🤖 INTELIGENCIA ARTIFICIAL", items: [
        { n: "ChatGPT Plus", p: "7 USD", img: "openai" }
    ]},
    { cat: "🎨 HERRAMIENTAS", items: [
        { n: "Canva Pro", p: "3.5 USD", img: "canva" }, { n: "Adobe Creative Cloud", p: "8 USD", img: "adobe" },
        { n: "Google Drive 2TB", p: "20 USD", img: "google-drive" }
    ]}
];

function render() {
    const cont = document.getElementById('catalogo');
    productos.forEach(c => {
        cont.innerHTML += `<div class="category-title">${c.cat}</div>`;
        c.items.forEach(i => {
            const logoUrl = `https://logo.clearbit.com/${i.img}.com`;
            cont.innerHTML += `
                <div class="card">
                    <img src="${logoUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5260/5260498.png'" alt="${i.n}">
                    <h3>${i.n}</h3>
                    <div class="price">${i.p}</div>
                    <div class="btn-group">
                        <button class="btn btn-ws" onclick="comprar('ws', '${i.n}', '${i.p}')">WHATSAPP</button>
                        <button class="btn btn-tg" onclick="comprar('tg', '${i.n}', '${i.p}')">TELEGRAM</button>
                    </div>
                </div>`;
        });
    });
}

function comprar(plataforma, prod, precio) {
    const msg = encodeURIComponent(`Hola SamBel Access! Quiero comprar: ${prod} (${precio}).`);
    if (plataforma === 'ws') {
        window.open(`https://wa.me/584242157241?text=${msg}`, '_blank');
    } else {
        window.open(`https://t.me/AccesesBels`, '_blank');
    }
}
render();
</script>
</body>
</html>
