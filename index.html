
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccesesBel Sc | Premium Store</title>
    <style>
        :root {
            --main: #00f2ff;
            --bg: #050505;
            --card: #121212;
            --text: #ffffff;
            --ws: #25d366;
            --tg: #0088cc;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.5;
        }
        header {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(180deg, #000 0%, var(--bg) 100%);
            border-bottom: 2px solid var(--main);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-main {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--main);
            box-shadow: 0 0 25px var(--main);
            margin-bottom: 15px;
            object-fit: cover;
        }
        .brand {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }
        .brand span { color: var(--main); text-shadow: 0 0 10px var(--main); }

        .container { max-width: 1400px; margin: auto; padding: 20px; }

        .category-header {
            font-size: 24px;
            font-weight: 800;
            margin: 50px 0 25px;
            padding: 15px 20px;
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent);
            border-left: 6px solid var(--main);
            color: var(--main);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #222;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--main);
            box-shadow: 0 0 35px rgba(0,242,255,0.15);
        }

        .icon-container {
            height: 70px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-container svg {
            height: 100%;
            width: auto;
            fill: var(--main);
            filter: drop-shadow(0 0 5px var(--main));
        }

        .price {
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            margin: 15px 0;
            display: block;
        }
        h3 {
            font-size: 19px;
            margin: 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }
        .btn {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            color: white;
            font-size: 14px;
            transition: 0.3s;
            text-decoration: none;
            text-transform: uppercase;
        }
        .btn-ws { background: var(--ws); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); }
        .btn-tg { background: var(--tg); box-shadow: 0 4px 15px rgba(0, 136, 204, 0.2); }
        .btn:hover {
            filter: brightness(1.2);
            transform: scale(1.03);
        }

        footer {
            text-align: center;
            padding: 100px 20px;
            opacity: 0.5;
            font-size: 14px;
            border-top: 1px solid #222;
        }
    </style>
</head>
