<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccesesBel Sc | Premium Store</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        :root { --main: #00f2ff; --sec: #00ff88; --bg: #050505; --card: #121212; --text: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        header { 
            padding: 40px 20px; text-align: center; 
            background: linear-gradient(180deg, #000 0%, var(--bg) 100%);
            border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000;
        }

        .logo-main { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--main); box-shadow: 0 0 20px var(--main); margin-bottom: 15px; object-fit: cover; }
        .brand { font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .brand span { color: var(--main); text-shadow: 0 0 10px var(--main); }

        .container { max-width: 1400px; margin: auto; padding: 20px; }
        .category-header { 
            font-size: 22px; font-weight: 800; margin: 50px 0 25px; padding: 12px 20px;
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent);
            border-left: 5px solid var(--main); color: var(--main); text-transform: uppercase;
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .card { 
            background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #222; 
            text-align: center; transition: 0.3s; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--main); box-shadow: 0 0 30px rgba(0,242,255,0.15); }
        
        .img-box { width: 90px; height: 90px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; }
        .card img { max-width: 100%; max-height: 100%; border-radius: 12px; }
        
        .price { font-size: 32px; font-weight: 900; color: #fff; margin: 15px 0; }
        h3 { font-size: 18px; margin: 0; height: 45px; display: flex; align-items: center; justify-content: center; }
        
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn { 
            padding: 14px; border-radius: 10px; border: none; font-weight: 800; 
            cursor: pointer; color: white; font-size: 13px; transition: 0.2s; text-decoration: none;
        }
        .btn-ws { background: #25d366; }
        .btn-tg { background: #0088cc; }
        .btn:hover { filter: brightness(1.2); transform: scale(1.02); }

        footer { text-align: center; padding: 80px; opacity: 0.4; font-size: 12px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" alt="Logo" class="logo-main" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5260/5260498.png'">
    <h1 class="brand">AccesesBel <span>Sc</span></h1>
</header>

<div class="container" id="app"></div>

<footer>&copy; 2026 ACCESESBEL SC | LA GUAIRA, VENEZUELA</footer>

<script>
const shop = [
    { cat: "🎮 GAMING & RECARGAS", items: [
        { n: "Minecraft Premium", p: "15 USD", img: "https://img.icons8.com/color/512/minecraft-main.png" },
        { n: "Free Fire Diamantes", p: "Desde 1 USD", img: "https://img.icons8.com/color/512/free-fire.png" },
        { n: "COD Mobile CP", p: "Desde 1 USD", img: "https://img.icons8.com/color/512/call-of-duty-mobile.png" },
        { n: "Blood Strike", p: "Desde 1 USD", img: "https://img.icons8.com/fluency/512/target.png" }
    ]},
    { cat: "🎬 SERIES Y PELÍCULAS", items: [
        { n: "Netflix Única", p: "6 USD", img: "https://img.icons8.com/color/512/netflix.png" },
        { n: "Netflix Premium", p: "4 USD", img: "https://img.icons8.com/color/512/netflix.png" },
        { n: "Disney+ Premium", p: "3.5 USD", img: "https://img.icons8.com/color/512/disney-plus.png" },
        { n: "Disney+ Estándar", p: "2 USD", img: "https://img.icons8.com/color/512/disney-plus.png" },
        { n: "MAX / HBO", p: "3 USD", img: "https://img.icons8.com/color/512/hbo.png" },
        { n: "Prime Video", p: "3 USD", img: "https://img.icons8.com/color/512/amazon-prime-video.png" },
        { n: "Crunchyroll", p: "2.5 USD", img: "https://img.icons8.com/color/512/crunchyroll.png" },
        { n: "Paramount+", p: "3 USD", img: "https://img.icons8.com/color/512/paramount-plus.png" }
    ]},
    { cat: "🎵 MÚSICA", items: [
        { n: "Spotify Premium", p: "4 USD", img: "https://img.icons8.com/color/512/spotify.png" },
        { n: "YouTube Premium", p: "4 USD", img: "https://img.icons8.com/color/512/youtube-play.png" },
        { n: "Apple Music", p: "3 USD", img: "https://img.icons8.com/color/512/apple-music.png" }
    ]},
    { cat: "🤖 IA & HERRAMIENTAS", items: [
        { n: "ChatGPT Plus", p: "7 USD", img: "https://img.icons8.com/ios-filled/512/chatgpt.png" },
        { n: "Canva Pro", p: "3.5 USD", img: "https://img.icons8.com/color/512/canva.png" },
        { n: "Adobe Creative Cloud", p: "8 USD", img: "https://img.icons8.com/color/512/adobe-creative-cloud.png" },
        { n: "Google Drive 2TB", p: "20 USD", img: "https://img.icons8.com/color/512/google-drive--v1.png" }
    ]}
];

const render = () => {
    const root = document.getElementById('app');
    shop.forEach(s => {
        let h = `<div class="category-header">${s.cat}</div><div class="grid">`;
        s.items.forEach(i => {
            h += `
                <div class="card">
                    <div class="img-box"><img src="${i.img}" alt="${i.n}"></div>
                    <h3>${i.n}</h3>
                    <span class="price">${i.p}</span>
                    <div class="actions">
                        <button class="btn btn-ws" onclick="go('ws','${i.n}','${i.p}')">WhatsApp</button>
                        <button class="btn btn-tg" onclick="go('tg','${i.n}','${i.p}')">Telegram</button>
                    </div>
                </div>`;
        });
        root.innerHTML += h + `</div>`;
    });
};

const go = (t, n, p) => {
    const m = encodeURIComponent(`¡Hola AccesesBel Sc! Quisiera adquirir: ${n} (${p}).`);
    window.open(t === 'ws' ? `https://wa.me/584242157241?text=${m}` : `https://t.me/AccesesBels`, '_blank');
};
render();
</script>
</body>
</html>
