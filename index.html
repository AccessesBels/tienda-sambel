<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccesesBel Sc | Premium Store</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        :root { --main: #00f2ff; --bg: #0a0a0a; --card: #151515; --text: #ffffff; --ws: #25d366; --tg: #0088cc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        header { 
            padding: 40px 20px; text-align: center; background: #000;
            border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000;
        }
        .logo-main { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--main); margin-bottom: 15px; object-fit: cover; }
        .brand { font-size: 28px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .brand span { color: var(--main); }

        .container { max-width: 1400px; margin: auto; padding: 20px; }
        .category-header { 
            font-size: 20px; font-weight: 800; margin: 40px 0 20px; padding: 10px 15px;
            background: rgba(0,242,255,0.1); border-left: 5px solid var(--main); color: var(--main); text-transform: uppercase;
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card); border-radius: 15px; padding: 25px; border: 1px solid #222; 
            text-align: center; transition: 0.3s;
        }
        .card:hover { border-color: var(--main); transform: translateY(-5px); }
        
        /* Contenedor de logos integrados */
        .icon-box { height: 60px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .icon-box svg { height: 100%; width: auto; fill: var(--main); }
        
        .price { font-size: 30px; font-weight: 800; color: #fff; margin: 15px 0; display: block; }
        h3 { font-size: 18px; margin: 0; min-height: 40px; }
        
        .btn { 
            display: block; width: 100%; padding: 12px 0; margin-top: 10px; border-radius: 8px; 
            border: none; font-weight: 800; cursor: pointer; color: white; text-decoration: none; font-size: 14px;
        }
        .btn-ws { background: var(--ws); }
        .btn-tg { background: var(--tg); }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" alt="Logo" class="logo-main" onerror="this.style.display='none'">
    <h1 class="brand">AccesesBel <span>Sc</span></h1>
</header>

<div class="container" id="app"></div>

<footer>
    <p style="text-align: center; padding: 40px; opacity: 0.5; font-size: 12px;">&copy; 2026 ACCESESBEL SC | VENEZUELA</p>
</footer>

<script>
const catalog = [
    { cat: "🎮 GAMING & RECARGAS", items: [
        { n: "Minecraft Premium", p: "15 USD" },
        { n: "Free Fire Diamantes", p: "Desde 1 USD" },
        { n: "COD Mobile CP", p: "Desde 1 USD" },
        { n: "Blood Strike", p: "Desde 1 USD" }
    ]},
    { cat: "🎬 SERIES Y PELÍCULAS", items: [
        { n: "Netflix Premium", p: "4 USD" },
        { n: "Disney+ Premium", p: "3.5 USD" },
        { n: "MAX (HBO)", p: "3 USD" },
        { n: "Prime Video", p: "3 USD" },
        { n: "Crunchyroll", p: "2.5 USD" },
        { n: "Paramount+", p: "3 USD" }
    ]},
    { cat: "🎵 MÚSICA", items: [
        { n: "Spotify Premium", p: "4 USD" },
        { n: "YouTube Premium", p: "4 USD" }
    ]},
    { cat: "🎨 HERRAMIENTAS & IA", items: [
        { n: "ChatGPT Plus", p: "7 USD" },
        { n: "Canva Pro", p: "3.5 USD" }
    ]}
];

// SVG genérico de alta calidad para evitar imágenes rotas
const iconSvg = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>`;

function render() {
    const root = document.getElementById('app');
    catalog.forEach(section => {
        let html = `<div class="category-header">${section.cat}</div><div class="grid">`;
        section.items.forEach(item => {
            html += `
                <div class="card">
                    <div class="icon-box">${iconSvg}</div>
                    <h3>${item.n}</h3>
                    <span class="price">${item.p}</span>
                    <button class="btn btn-ws" onclick="order('ws','${item.n}','${item.p}')">WHATSAPP</button>
                    <button class="btn btn-tg" onclick="order('tg','${item.n}','${item.p}')">TELEGRAM</button>
                </div>`;
        });
        root.innerHTML += html + `</div>`;
    });
}

function order(type, prod, price) {
    const msg = encodeURIComponent(`Hola AccesesBel Sc! Quisiera adquirir: ${prod} por ${price}.`);
    window.open(type === 'ws' ? `https://wa.me/584242157241?text=${msg}` : `https://t.me/AccesesBels`, '_blank');
}
render();
</script>
</body>
</html>
