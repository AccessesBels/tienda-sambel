<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccesesBel Sc | Premium Store</title>
    <!-- Favicon (Logito de pestaña) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        :root { --main: #00f2ff; --sec: #00ff88; --bg: #050505; --card: #121212; --text: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        header { 
            padding: 40px 20px; 
            text-align: center; 
            background: linear-gradient(180deg, #000 0%, var(--bg) 100%);
            border-bottom: 2px solid var(--main);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-main { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--main); box-shadow: 0 0 20px var(--main); margin-bottom: 15px; object-fit: cover; }
        .brand { font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .brand span { color: var(--main); text-shadow: 0 0 10px var(--main); }

        .container { max-width: 1400px; margin: auto; padding: 20px; }
        .category-header { 
            font-size: 24px; font-weight: 800; margin: 50px 0 25px; padding: 12px 20px;
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent);
            border-left: 5px solid var(--main); color: var(--main); text-transform: uppercase;
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { 
            background: var(--card); border-radius: 20px; padding: 30px; border: 1px solid #222; 
            text-align: center; transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--main); box-shadow: 0 0 40px rgba(0,242,255,0.15); }
        
        /* Contenedor de imagen para evitar que se vea roto */
        .img-box { width: 100px; height: 100px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
        .card img { max-width: 100%; max-height: 100%; border-radius: 15px; }
        
        .price { font-size: 36px; font-weight: 900; color: #fff; margin: 15px 0; display: block; }
        
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn { 
            padding: 15px; border-radius: 10px; border: none; font-weight: 800; 
            cursor: pointer; text-decoration: none; color: white; font-size: 14px; transition: 0.2s; 
        }
        .btn-ws { background: #25d366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); }
        .btn-tg { background: #0088cc; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.2); }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        footer { text-align: center; padding: 80px; opacity: 0.4; font-size: 13px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<header>
    <!-- Asegúrate de subir tu logo con el nombre logo.jpg a GitHub -->
    <img src="logo.jpg" alt="AccesesBel Logo" class="logo-main" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5260/5260498.png'">
    <h1 class="brand">AccesesBel <span>Sc</span></h1>
</header>

<div class="container" id="app"></div>

<footer>&copy; 2026 ACCESESBEL SC | VENTA DE CUENTAS Y RECARGAS</footer>

<script>
const shop = [
    { cat: "🎮 GAMING & RECARGAS", items: [
        { n: "Minecraft Premium", p: "15 USD", img: "https://img.icons8.com/color/512/minecraft-main.png" },
        { n: "Free Fire Diamantes", p: "Desde 1 USD", img: "https://img.icons8.com/color/512/free-fire.png" },
        { n: "COD Mobile CP", p: "Desde 1 USD", img: "https://img.icons8.com/color/512/call-of-duty-mobile.png" },
        { n: "Blood Strike", p: "Desde 1 USD", img: "https://img.icons8.com/fluency/512/target.png" }
    ]},
    { cat: "🎬 SERIES Y PELÍCULAS", items: [
        { n: "Netflix Premium", p: "4 USD", img: "https://img.icons8.com/color/512/netflix.png" },
        { n: "Disney+ Premium", p: "3.5 USD", img: "https://img.icons8.com/color/512/disney-plus.png" },
        { n: "MAX Premium", p: "3 USD", img: "https://img.icons8.com/color/512/hbo.png" },
        { n: "Crunchyroll Mega Fan", p: "2.5 USD", img: "https://img.icons8.com/color/512/crunchyroll.png" }
    ]},
    { cat: "🎵 MÚSICA", items: [
        { n: "Spotify Premium", p: "4 USD", img: "https://img.icons8.com/color/512/spotify.png" },
        { n: "YouTube Premium", p: "4 USD", img: "https://img.icons8.com/color/512/youtube-play.png" }
    ]}
];

const render = () => {
    const root = document.getElementById('app');
    shop.forEach(s => {
        let html = `<div class="category-header">${s.cat}</div><div class="grid">`;
        s.items.forEach(i => {
            html += `
                <div class="card">
                    <div class="img-box"><img src="${i.img}" alt="${i.n}"></div>
                    <h3>${i.n}</h3>
                    <span class="price">${i.p}</span>
                    <div class="actions">
                        <button class="btn btn-ws" onclick="order('ws','${i.n}','${i.p}')">PEDIR POR WHATSAPP</button>
                        <button class="btn btn-tg" onclick="order('tg','${i.n}','${i.p}')">PEDIR POR TELEGRAM</button>
                    </div>
                </div>`;
        });
        root.innerHTML += html + `</div>`;
    });
};

const order = (type, prod, price) => {
    const text = encodeURIComponent(`¡Hola AccesesBel Sc! Quisiera adquirir: ${prod} por ${price}.`);
    window.open(type === 'ws' ? `https://wa.me/584242157241?text=${text}` : `https://t.me/AccesesBels`, '_blank');
};

render();
</script>
</body>
</html>
