<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamBel Access | Premium Store</title>
    <style>
        :root { --main: #007bff; --bg: #050505; --card: #121212; --text: #ffffff; --ws: #25d366; --tg: #0088cc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
        header { padding: 50px 20px; text-align: center; background: #000; border-bottom: 3px solid var(--main); box-shadow: 0 0 30px rgba(0,123,255,0.4); }
        .logo { font-size: 35px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }
        .logo span { color: var(--main); text-shadow: 0 0 10px var(--main); }
        
        .container { max-width: 1400px; margin: auto; padding: 20px; }
        .category-header { font-size: 24px; font-weight: bold; margin: 50px 0 20px; padding-left: 15px; border-left: 5px solid var(--main); text-transform: uppercase; color: var(--main); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #222; text-align: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card:hover { transform: translateY(-12px); border-color: var(--main); box-shadow: 0 15px 40px rgba(0,123,255,0.3); }
        
        .card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 20px; border-radius: 15px; background: #1a1a1a; padding: 10px; }
        .card h3 { margin: 10px 0; font-size: 20px; letter-spacing: 1px; }
        .price { font-size: 34px; font-weight: 900; color: #fff; margin: 15px 0; display: block; }
        
        .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn { padding: 14px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; text-decoration: none; color: white; font-size: 13px; transition: 0.3s; text-transform: uppercase; }
        .btn-ws { background: var(--ws); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-tg { background: var(--tg); box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); }
        .btn:hover { filter: brightness(1.2); transform: scale(1.05); }

        footer { text-align: center; padding: 80px 20px; opacity: 0.5; font-size: 13px; border-top: 1px solid #222; margin-top: 50px; }
    </style>
</head>
<body>

<header><div class="logo">SamBel <span>Access</span></div></header>

<div class="container" id="app"></div>

<footer>&copy; 2026 SAMBEL ACCESS | LA GUAIRA, VENEZUELA</footer>

<script>
const store = [
    { cat: "🎮 GAMING & RECARGAS", items: [
        { n: "Minecraft Premium", p: "15 USD", img: "https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png" },
        { n: "Free Fire Diamantes", p: "Desde 1 USD", img: "https://dl.v.garena.com/static/web/icon.png" },
        { n: "COD Mobile CP", p: "Desde 1 USD", img: "https://m.media-amazon.com/images/I/718fG-mNfGL.png" },
        { n: "Blood Strike", p: "Desde 1 USD", img: "https://play-lh.googleusercontent.com/97S24A_mN-k1XQe-E4RshE580lKqj7mZ0z_26z-Z-PjE7zJ5Ym7v1pS7N6eXh6Y" }
    ]},
    { cat: "🎬 SERIES Y PELÍCULAS", items: [
        { n: "Netflix Premium", p: "4 USD", img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" },
        { n: "Disney+ Premium", p: "3.5 USD", img: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" },
        { n: "MAX Premium", p: "3 USD", img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Max_logo.svg" },
        { n: "Prime Video", p: "3 USD", img: "https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg" },
        { n: "Crunchyroll Mega Fan", p: "2.5 USD", img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Crunchyroll_Logo.svg" }
    ]},
    { cat: "🎵 MÚSICA", items: [
        { n: "Spotify Premium", p: "4 USD", img: "https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" },
        { n: "YouTube Premium", p: "4 USD", img: "https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" }
    ]},
    { cat: "🤖 INTELIGENCIA ARTIFICIAL", items: [
        { n: "ChatGPT Plus", p: "7 USD", img: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" }
    ]},
    { cat: "🎨 HERRAMIENTAS", items: [
        { n: "Canva Pro", p: "3.5 USD", img: "https://upload.wikimedia.org/wikipedia/commons/0/0e/Canva_logo.svg" },
        { n: "Adobe Creative Cloud", p: "8 USD", img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Adobe_Creative_Cloud_logo.svg" }
    ]}
];

const render = () => {
    const root = document.getElementById('app');
    store.forEach(section => {
        let html = `<div class="category-header">${section.cat}</div><div class="grid">`;
        section.items.forEach(item => {
            html += `
                <div class="card">
                    <img src="${item.img}" alt="${item.n}">
                    <h3>${item.n}</h3>
                    <span class="price">${item.p}</span>
                    <div class="actions">
                        <button class="btn btn-ws" onclick="comprar('ws', '${item.n}', '${item.p}')">Pedir por WhatsApp</button>
                        <button class="btn btn-tg" onclick="comprar('tg', '${item.n}', '${item.p}')">Pedir por Telegram</button>
                    </div>
                </div>`;
        });
        html += `</div>`;
        root.innerHTML += html;
    });
};

const comprar = (type, prod, price) => {
    const msg = encodeURIComponent(`¡Hola SamBel Access! Quisiera adquirir el servicio: ${prod} por ${price}.`);
    if (type === 'ws') {
        window.open(`https://wa.me/584242157241?text=${msg}`, '_blank');
    } else {
        window.open(`https://t.me/AccesesBels`, '_blank');
    }
};

render();
</script>
</body>
</html>
